server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Edge на хосте → published port: peer часто 172.x (docker
    # gateway), не 127.0.0.1. Доверяем private ranges, чтобы
    # real_ip подставил клиента из X-Forwarded-For.
    # Порт frontend лучше публиковать как 127.0.0.1:3080:80.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-store';
    }

    location ~* \.(js|css|html)$ {
        add_header Cache-Control 'no-store, no-cache, must-revalidate';
        add_header Pragma 'no-cache';
        expires -1;
    }

    # Прокси /api на бэкенд (same-origin cookies)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Только peer / real_ip — без склейки клиентского XFF
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffer_size 256k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
